<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Health Prospect CRM</title>
  <desc id="desc">Diagrama em camadas com acesso, aplicação Laravel, dados PostgreSQL e Redis, integrações, observabilidade, CI e controles de segurança.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7088"/>
    </marker>
    <style>
      .title{font:700 34px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#102a43}.subtitle{font:500 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486581}.section{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:1px;fill:#1769aa}.boxTitle{font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#102a43}.text{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486581}.small{font:400 12.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#627d98}.badge{font:700 12px system-ui,-apple-system,"Segoe UI",sans-serif}.line{stroke:#5b7088;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f7fafc"/>

