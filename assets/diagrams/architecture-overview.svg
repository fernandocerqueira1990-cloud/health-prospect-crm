  <text x="322" y="776" class="small">CI com permissões restritas</text>
  <path d="M478 758 L518 758" class="line"/>
  <rect x="520" y="720" width="176" height="76" rx="12" fill="#eefaf4"/>
  <text x="540" y="750" class="boxTitle">Testes</text>
  <text x="540" y="776" class="small">PHPUnit · 534 testes na Sprint 10</text>
  <path d="M696 758 L736 758" class="line"/>
  <rect x="738" y="720" width="148" height="76" rx="12" fill="#fff8e8"/>
  <text x="758" y="750" class="boxTitle">Qualidade</text>
  <text x="758" y="776" class="small">Pint · PHPStan · audits</text>

  <rect x="940" y="662" width="440" height="164" rx="18" fill="#fffaf0" stroke="#f0c36b" filter="url(#shadow)"/>
  <text x="964" y="697" class="section" fill="#9a6700">SEGURANÇA IMPLEMENTADA</text>
  <text x="964" y="728" class="text">✓ RBAC + Policies/Gates + proteção IDOR</text>
  <text x="964" y="752" class="text">✓ Rate limiting · CSRF · sessões seguras</text>
  <text x="964" y="776" class="text">✓ Security headers · proxies confiáveis</text>
  <text x="964" y="800" class="text">✓ Hardening de imports · logs e secrets</text>

